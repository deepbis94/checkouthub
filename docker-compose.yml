services:
  app:
    build:
      context: ./api
    volumes:
      - ./api:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_NAME: CheckoutHub
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: checkouthub
      DB_USERNAME: checkouthub
      DB_PASSWORD: secret
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PREFIX: checkouthub_
      CHECKOUTHUB_WORKER_TOKEN: checkouthub-worker-dev-token
      STRIPE_MODE: simulate
      RAZORPAY_MODE: simulate
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    volumes:
      - ./worker:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_URL: http://app:8000
      CHECKOUTHUB_WORKER_TOKEN: checkouthub-worker-dev-token
      LARAVEL_REDIS_PREFIX: checkouthub_
      PROBE_INTERVAL_MS: 15000
    command: sh -c "npm install && node src/index.js"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: checkouthub
      MYSQL_USER: checkouthub
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucheckouthub", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
